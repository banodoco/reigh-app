<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: the Astrid mink as crisp pixel-art SVG, with a PNG fallback, on the public site and in the app. -->
    <link rel="icon" href="/astrid-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/astrid-favicon-32.png" type="image/png" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <!-- The page paper; the public pages and the app then keep it in step with their own background. -->
    <meta name="theme-color" content="#f7f4ed" />
    <!-- Deprecated tag removed to avoid console warnings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Astrid" />
    <link rel="apple-touch-icon" href="/astrid-apple-touch-icon.png" />

    <!-- Installed-app typography is requested by main.tsx only after the
         protected app entry is selected; the public landing stays local-only. -->

    <meta name="author" content="Astrid" />

    <!-- Title, description and the link-preview card (Open Graph, X), filled per page by
         config/vite/shareMeta.ts from src/pages/Home/publicAstridShare.ts. -->
    <!-- share-meta:start --><!-- share-meta:end -->

    <!-- Critical images are preloaded dynamically by useHomePagePreload hook -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    
    <!-- Service Worker Registration for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const deterministicLocalTest = new URLSearchParams(window.location.search).get('localTest') === '1';
          if (deterministicLocalTest) {
            Promise.all([
              navigator.serviceWorker.getRegistrations()
                .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
              'caches' in window
                ? caches.keys().then((names) => Promise.all(names.map((name) => caches.delete(name))))
                : Promise.resolve(),
            ]).catch(() => { /* test isolation is also asserted in-browser */ });
            return;
          }
          navigator.serviceWorker.register('/sw.js').catch(() => { /* silent */ });
        });
      }
    </script>
  </body>
</html>
