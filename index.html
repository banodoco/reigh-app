<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: the Astrid mink as crisp pixel-art SVG, with a PNG fallback, on the public site and in the app. -->
    <link rel="icon" href="/astrid-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/astrid-favicon-32.png" type="image/png" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <!-- The page paper; the public pages and the app then keep it in step with their own background. -->
    <meta name="theme-color" content="#f7f4ed" />
    <!-- Deprecated tag removed to avoid console warnings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Astrid" />
    <link rel="apple-touch-icon" href="/astrid-apple-touch-icon.png" />

    <!-- Installed-app typography is requested by main.tsx only after the
         protected app entry is selected; the public landing stays local-only. -->

    <meta name="author" content="Astrid" />

    <!-- Title, description and the link-preview card (Open Graph, X), filled per page by
         config/vite/shareMeta.ts from src/pages/Home/publicAstridShare.ts. -->
    <!-- share-meta:start --><!-- share-meta:end -->

    <!-- Critical images are preloaded dynamically by useHomePagePreload hook -->

    <!-- Boot layer: the page paper and ink (the last applied theme, cached by applyAppTheme)
         with Astrid's running mink, a static copy of MinkRunner (same sprite, frames and
         cycle), until the page's first real frame has painted (src/app/bootLayer.ts).
         In: the mink fades in over 400ms, only after 300ms, so fast loads never see it.
         Every boot animation is transform or opacity (the body wipe moves a masked layer and
         counter-moves its content), so the compositor keeps it moving on a busy main thread.
         Out, with a logo to land on (.boot-flying): the mink runs home to the header logo
         (600ms), slowing to a stop, while its body dissolves from the bottom up so only its
         head arrives, on the logo's head; then the two trade places (180ms). The paper
         dissolves meanwhile (360ms).
         Out otherwise (.boot-done): it runs on and fades (120ms) as the paper dissolves (260ms). -->
    <script>
      try {
        var bootTheme = JSON.parse(localStorage.getItem('astrid:boot-theme') || 'null');
        if (bootTheme) {
          document.documentElement.style.setProperty('--boot-background', bootTheme.background);
          document.documentElement.style.setProperty('--boot-ink', bootTheme.ink);
        }
      } catch (error) { /* storage blocked: keep the default paper */ }
    </script>
    <style>
      body { margin: 0; background-color: var(--boot-background, #faf8f5); }
      #boot {
        position: fixed; inset: 0; z-index: 2147483647; pointer-events: none;
        display: flex; align-items: center; justify-content: center; color: var(--boot-ink, #2b2724);
      }
      .boot-paper {
        position: absolute; inset: 0; background-color: var(--boot-background, #faf8f5);
        transition: opacity 260ms cubic-bezier(0.45, 0, 0.55, 1);
      }
      #boot.boot-done .boot-paper, #boot.boot-flying .boot-paper { opacity: 0; }
      #boot.boot-flying .boot-paper { transition-duration: 360ms; }
      /* MinkRunner (src/shared/components/MinkRunner): 11 frames of 81x44 at 770ms a cycle. The
         scale keeps each frame a whole number of device pixels wide (180), so the stepped strip
         never lands between pixels. */
      .boot-mink {
        --s: calc(20 / 9); position: relative; display: grid; justify-items: center; gap: calc(1px * var(--s));
        animation: boot-mink-in 400ms ease-out 300ms backwards;
        transition: opacity 120ms ease-out, transform 120ms ease-out;
      }
      @media (min-resolution: 2dppx) { .boot-mink { --s: calc(10 / 9); } }
      /* A mink still waiting out its delay stays hidden (the paused animation holds its first frame). */
      #boot.boot-done .boot-mink { opacity: 0; transform: translateX(calc(6px * var(--s))); animation-play-state: paused; }
      #boot.boot-landed .boot-mink { opacity: 0; transition: opacity 180ms ease-out; }
      .boot-mink-flight-y, .boot-mink-wipe, .boot-mink-unwipe { display: block; will-change: transform; }
      .boot-mink-flight-x {
        display: block; position: relative; will-change: transform;
        width: calc(81px * var(--s)); height: calc(44px * var(--s));
      }
      /* The body wipe: a feathered edge at 30deg (mostly bottom to top) fixed to this padded
         layer. bootLayer.ts moves the layer up the gradient and its content back down by the
         same distance, so the edge sweeps up the mink while the mink stays put. The layer reaches
         60 frame px past the frame on every side, so the content stays inside the mask; the stops
         sit 40-50 frame px before the line's midpoint (121.26 for this box), just below the
         frame's lowest corner. */
      .boot-mink-wipe {
        position: absolute; inset: calc(-60px * var(--s));
        -webkit-mask-image: linear-gradient(30deg, transparent calc(71.26px * var(--s)), #000 calc(81.26px * var(--s)));
        mask-image: linear-gradient(30deg, transparent calc(71.26px * var(--s)), #000 calc(81.26px * var(--s)));
      }
      .boot-mink-unwipe { position: absolute; left: calc(60px * var(--s)); top: calc(60px * var(--s)); }
      .boot-mink-window { display: block; overflow: hidden; width: calc(81px * var(--s)); height: calc(44px * var(--s)); }
      /* Two cycles long, so the run can ease to a stop a few frames on from any frame. */
      .boot-mink-strip {

        animation: boot-mink-run 770ms steps(11) infinite;
      }
      .boot-mink-ground {
        display: block; overflow: hidden; width: calc(81px * var(--s) * 1.6); height: calc(1px * var(--s));
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
        transition: opacity 160ms ease-out;
      }
      #boot.boot-flying .boot-mink-ground { opacity: 0; }
      .boot-mink-ground > span {
        display: block; width: calc(100% + 12px * var(--s)); height: 100%;
        background: repeating-linear-gradient(90deg, color-mix(in srgb, currentColor 28%, transparent) 0 calc(4px * var(--s)), transparent calc(4px * var(--s)) calc(12px * var(--s)));
        animation: boot-mink-ground 257ms linear infinite;
      }
      @keyframes boot-mink-in { from { opacity: 0; } }
      @keyframes boot-mink-run { to { transform: translateX(calc(891px * var(--s) * -1)); } }
      @keyframes boot-mink-ground { to { transform: translateX(calc(-12px * var(--s))); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-paper, .boot-mink { transition: none; }
        .boot-mink { animation-duration: 0ms; }
        .boot-mink-strip, .boot-mink-ground > span { animation: none; }
      }
    </style>

  <body>
    <div id="boot" aria-hidden="true"><div class="boot-paper"></div><div class="boot-mink"><span class="boot-mink-flight-y"><span class="boot-mink-flight-x"><span class="boot-mink-wipe"><span class="boot-mink-unwipe"><span class="boot-mink-window"><span class="boot-mink-strip"></span></span></span></span></span></span><span class="boot-mink-ground"><span></span></span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    
    <!-- Service Worker Registration for PWA -->
    <script type="module">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (import.meta.env.DEV) {
            const appWorkerUrl = new URL('/sw.js', window.location.href).href;
            Promise.all([
              navigator.serviceWorker.getRegistrations()
                .then((registrations) => Promise.all(registrations
                  .filter((registration) => [registration.active, registration.waiting, registration.installing]
                    .some((worker) => worker?.scriptURL === appWorkerUrl))
                  .map((registration) => registration.unregister()))),
              'caches' in window ? caches.delete('astrid-app-v3') : Promise.resolve(),
            ]).catch(() => { /* dev cleanup is best effort */ });
            return;
          }

          const deterministicLocalTest = new URLSearchParams(window.location.search).get('localTest') === '1';
          if (deterministicLocalTest) {
            Promise.all([
              navigator.serviceWorker.getRegistrations()
                .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
              'caches' in window
                ? caches.keys().then((names) => Promise.all(names.map((name) => caches.delete(name))))
                : Promise.resolve(),
            ]).catch(() => { /* test isolation is also asserted in-browser */ });
            return;
          }
          navigator.serviceWorker.register('/sw.js').catch(() => { /* silent */ });
        });
      }
    </script>
  </body>
